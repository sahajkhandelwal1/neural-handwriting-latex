<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Handwriting LaTeX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #000;
      --surface:   #0d0d0d;
      --surface2:  #141414;
      --border:    #222;
      --border2:   #2a2a2a;
      --text:      #f0f0f0;
      --muted:     #555;
      --muted2:    #777;
      --accent:    #7c6ee6;
      --accent2:   #5a4fcf;
      --green:     #34d399;
      --red:       #f87171;
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Nav ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 0.25rem;
    }

    .nav-links a {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted2);
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .nav-links a:hover { color: var(--text); background: var(--surface2); }

    /* ── Layout ── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent2);
      background: rgba(124,110,230,0.08);
      padding: 0.3rem 0.75rem;
      border-radius: 100px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero p {
      font-size: 0.95rem;
      color: var(--muted2);
      max-width: 420px;
      margin: 0 auto;
    }

    /* ── Upload card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1rem;
    }

    .drop-zone {
      border: 1.5px dashed var(--border2);
      border-radius: 10px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(124,110,230,0.05);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      width: 44px;
      height: 44px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.2rem;
    }

    .drop-label {
      font-size: 0.875rem;
      color: var(--muted2);
    }

    .drop-label strong { color: var(--accent); font-weight: 600; }

    .drop-hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.4rem;
      letter-spacing: 0.04em;
    }

    /* ── Preview ── */
    #preview-wrap {
      display: none;
      margin-top: 1.25rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #preview-wrap img {
      width: 100%;
      display: block;
      max-height: 280px;
      object-fit: contain;
      background: #080808;
    }

    .preview-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.875rem;
      background: var(--surface2);
      border-top: 1px solid var(--border);
    }

    .preview-name {
      font-size: 0.75rem;
      color: var(--muted2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .btn-clear:hover { color: var(--red); }

    /* ── Filename input ── */
    .filename-row {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .filename-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted2);
      white-space: nowrap;
    }

    .filename-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 7px;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .filename-input-wrap:focus-within { border-color: var(--accent); }

    .filename-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      padding: 0.5rem 0.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      color: var(--text);
      min-width: 0;
    }

    .filename-input::placeholder { color: var(--muted); }

    .filename-ext {
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0 0.65rem 0 0;
      user-select: none;
    }

    /* ── Convert button ── */
    #convert-btn {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.8rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid #333;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      color: #000;
      letter-spacing: 0.01em;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
    }

    #convert-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #convert-btn:not(:disabled):hover { background: #e8e8e8; }
    #convert-btn:not(:disabled):active { transform: scale(0.99); }

    /* ── Status ── */
    #status {
      margin-top: 1rem;
      font-size: 0.82rem;
      min-height: 1.4em;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    #status.idle    { color: var(--muted); }
    #status.working { color: var(--accent); }
    #status.success { color: var(--green); }
    #status.error   { color: var(--red); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted2);
    }

    .section-count {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.2rem 0.55rem;
      border-radius: 100px;
    }

    /* ── History ── */
    #history-section { margin-top: 3rem; }

    #history-list {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .hist-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.15s;
    }

    .hist-item:hover { border-color: var(--border2); }

    .hist-icon {
      width: 38px;
      height: 38px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .hist-info {
      flex: 1;
      min-width: 0;
    }

    .hist-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-date {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .hist-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn-dl, .btn-del {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-dl {
      background: #fff;
      border: 1px solid #333;
      color: #000;
    }

    .btn-dl:hover { background: #e8e8e8; }

    .btn-del {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-del:hover { border-color: #555; color: var(--text); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state .empty-icon { font-size: 1.75rem; margin-bottom: 0.75rem; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 3rem 0;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#">Neural<span>LaTeX</span></a>
  <div class="nav-links">
    <a href="#convert-section">Convert</a>
    <a href="#history-section">History</a>
  </div>
</nav>

<main>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-badge">✦ GPT-4o Vision</div>
    <h1>Handwriting to<br><em>LaTeX PDF</em></h1>
    <p>Upload a photo of handwritten math or text — get a perfectly typeset PDF in seconds.</p>
  </div>

  <!-- Upload card -->
  <div id="convert-section" class="card">
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" />
      <div class="drop-icon">📷</div>
      <p class="drop-label"><strong>Choose an image</strong> or drag it here</p>
      <p class="drop-hint">JPEG · PNG · WEBP · GIF</p>
    </div>

    <div id="preview-wrap">
      <img id="preview-img" src="" alt="preview" />
      <div class="preview-meta">
        <span class="preview-name" id="preview-name"></span>
        <button class="btn-clear" id="clear-btn">✕ Clear</button>
      </div>
    </div>

    <div class="filename-row">
      <label class="filename-label" for="pdf-name">PDF filename</label>
      <div class="filename-input-wrap">
        <input type="text" id="pdf-name" class="filename-input" placeholder="handwriting" spellcheck="false" />
        <span class="filename-ext">.pdf</span>
      </div>
    </div>

    <button id="convert-btn" disabled>Convert to PDF</button>
    <div id="status" class="idle">Select an image to get started.</div>
  </div>

  <div class="divider"></div>

  <!-- History -->
  <section id="history-section">
    <div class="section-header">
      <span class="section-title">History</span>
      <span class="section-count" id="hist-count">0 PDFs</span>
    </div>
    <div id="history-list"></div>
  </section>

</main>

<script>
  const dropZone    = document.getElementById('drop-zone');
  const fileInput   = document.getElementById('file-input');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg  = document.getElementById('preview-img');
  const previewName = document.getElementById('preview-name');
  const clearBtn    = document.getElementById('clear-btn');
  const convertBtn  = document.getElementById('convert-btn');
  const statusEl    = document.getElementById('status');
  const pdfNameInput = document.getElementById('pdf-name');
  const histList    = document.getElementById('history-list');
  const histCount   = document.getElementById('hist-count');

  let selectedFile = null;

  // ── Status helpers ──
  function setStatus(msg, cls, spinning = false) {
    statusEl.className = cls;
    statusEl.innerHTML = spinning
      ? `<div class="spinner"></div>${msg}`
      : msg;
  }

  // ── File selection ──
  function showPreview(file) {
    selectedFile = file;
    previewImg.src = URL.createObjectURL(file);
    previewName.textContent = file.name;
    previewWrap.style.display = 'block';
    convertBtn.disabled = false;
    // Pre-fill filename from image name (strip extension)
    if (!pdfNameInput.value) {
      pdfNameInput.value = file.name.replace(/\.[^.]+$/, '');
    }
    setStatus('Ready to convert.', 'idle');
  }

  function clearSelection() {
    selectedFile = null;
    fileInput.value = '';
    previewImg.src = '';
    previewWrap.style.display = 'none';
    convertBtn.disabled = true;
    pdfNameInput.value = '';
    setStatus('Select an image to get started.', 'idle');
  }

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) showPreview(fileInput.files[0]);
  });

  clearBtn.addEventListener('click', clearSelection);

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) showPreview(file);
    else setStatus('Please drop an image file.', 'error');
  });

  // ── Convert ──
  convertBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    convertBtn.disabled = true;
    setStatus('Transcribing handwriting…', 'working', true);

    const name = (pdfNameInput.value.trim() || 'handwriting').replace(/\.pdf$/i, '');
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('pdf_name', name);

    try {
      const res = await fetch('/convert', { method: 'POST', body: formData });

      if (!res.ok) {
        let detail = `Error ${res.status}`;
        try { detail = (await res.json()).detail || detail; } catch {}
        setStatus(detail, 'error');
        convertBtn.disabled = false;
        return;
      }

      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = `${name}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);

      setStatus('PDF downloaded successfully!', 'success');
      convertBtn.disabled = false;
      loadHistory();

    } catch (err) {
      setStatus(`Network error: ${err.message}`, 'error');
      convertBtn.disabled = false;
    }
  });

  // ── History ──
  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
      + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function renderHistory(entries) {
    histCount.textContent = `${entries.length} PDF${entries.length !== 1 ? 's' : ''}`;

    if (entries.length === 0) {
      histList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📄</div>
          No conversions yet. Upload an image to get started.
        </div>`;
      return;
    }

    histList.innerHTML = entries.map(e => `
      <div class="hist-item" data-id="${e.id}">
        <div class="hist-icon">📄</div>
        <div class="hist-info">
          <div class="hist-name">${escHtml(e.name)}</div>
          <div class="hist-date">${formatDate(e.created_at)}</div>
        </div>
        <div class="hist-actions">
          <a class="btn-dl" href="/history/${e.id}/pdf" download="${escHtml(e.name)}">↓ Download</a>
          <button class="btn-del" data-id="${e.id}">✕</button>
        </div>
      </div>`).join('');

    histList.querySelectorAll('.btn-del').forEach(btn => {
      btn.addEventListener('click', () => deleteEntry(btn.dataset.id));
    });
  }

  async function loadHistory() {
    try {
      const res = await fetch('/history');
      if (res.ok) renderHistory(await res.json());
    } catch {}
  }

  async function deleteEntry(id) {
    try {
      await fetch(`/history/${id}`, { method: 'DELETE' });
      loadHistory();
    } catch {}
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Initial load
  loadHistory();
</script>
</body>
</html>
